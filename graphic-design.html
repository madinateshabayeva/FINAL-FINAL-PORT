.section-title {

}

.subcat-grid {
  display: grid;

  gap: 35px;
  margin-top: 30px;
}

.subcat-card {
  height: 260px;
  display: block;
  border-radius: 24px;
  background: linear-gradient(135deg, #b392be, #edb9d4);
  transition: 0.3s ease;
	overflow: hidden;
  display: block;
}

.subcat-card:hover {
  transform: scale(1.04);
  box-shadow: 0 18px 40px rgba(105, 0, 90, 0.18);
}
.subcat-card img {
  width: 100%;
  height: 100%;
  object-fit: cover; 
  display: block;
}
	.subcat-card:hover img {
  transform: scale(1.05);
}
.subcat-card img {
  transition: 0.4s ease;
}
